<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coronary Territories &amp; ECG</title>
<meta name="description" content="An interactive 3D heart: coronary arteries and veins, AHA wall segments, the 12-lead ECG each occlusion produces, and the matching gross pathology as the infarct evolves.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<script>
  // Set the theme before first paint so a dark-mode reader never sees a white flash.
  try {
    var t = localStorage.getItem('theme');
    document.documentElement.dataset.theme =
      t === 'dark' || t === 'light'
        ? t
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  } catch (e) { /* private mode: fall through to the light default */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
